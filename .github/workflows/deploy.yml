name: Deploy React UI to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          # We pass the secret into the script environment here:
          envs: VITE_API_URL
          script: |
            # 1. Create the production env file right inside the directory dynamically
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_URL }}" > /var/www/vhosts/rocksnet-ui/.env.production
            
            # 2. Trigger your standard build script
            /var/www/vhosts/rocksnet-ui/deploy.sh